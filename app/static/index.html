<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek LLM Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .model-select {
            margin-bottom: 16px;
        }
        .model-select label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }
        .model-select select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .model-select select:focus {
            border-color: #4a90d9;
        }
        .chat-box {
            height: 400px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            margin-bottom: 16px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.user {
            background: #4a90d9;
            color: #fff;
            margin-left: auto;
        }
        .message.assistant {
            background: #e8e8e8;
            color: #333;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            height: 44px;
            outline: none;
        }
        .input-area textarea:focus {
            border-color: #4a90d9;
        }
        .input-area button {
            padding: 0 24px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #357abd;
        }
        .input-area button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .stream-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
        }
        .stream-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        .status-bar {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DeepSeek LLM Gateway</h1>
        <div class="model-select">
            <label for="model">选择模型</label>
            <select id="model">
                <option value="deepseek-chat">DeepSeek Chat (V3)</option>
                <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
                <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                <option value="deepseek-flash">DeepSeek V4 Flash</option>
            </select>
        </div>
        <div class="stream-toggle">
            <input type="checkbox" id="streamToggle" checked>
            <label for="streamToggle">启用流式输出</label>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <textarea id="userInput" placeholder="输入消息..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <div class="status-bar" id="statusBar">就绪</div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('model');
        const streamToggle = document.getElementById('streamToggle');
        const statusBar = document.getElementById('statusBar');
        let messages = [];

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const content = userInput.value.trim();
            if (!content) return;

            const model = modelSelect.value;
            const useStream = streamToggle.checked;

            addMessage('user', content);
            messages.push({ role: 'user', content });
            userInput.value = '';
            sendBtn.disabled = true;
            statusBar.textContent = '发送中...';

            const assistantDiv = addMessage('assistant', '');
            let fullResponse = '';

            try {
                if (useStream) {
                    const response = await fetch('/api/v1/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model, messages })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6).trim();
                                if (data === '[DONE]') continue;
                                try {
                                    const parsed = JSON.parse(data);
                                    const delta = parsed.choices?.[0]?.delta?.content || '';
                                    if (delta) {
                                        fullResponse += delta;
                                        assistantDiv.textContent = fullResponse;
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                    }
                                } catch (e) { /* skip */ }
                            }
                        }
                    }
                } else {
                    const response = await fetch('/api/v1/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model, messages })
                    });
                    const data = await response.json();
                    fullResponse = data.choices?.[0]?.message?.content || '';
                    assistantDiv.textContent = fullResponse;
                }

                messages.push({ role: 'assistant', content: fullResponse });
                statusBar.textContent = '完成';
            } catch (error) {
                assistantDiv.textContent = '❌ 请求失败: ' + error.message;
                statusBar.textContent = '错误';
            } finally {
                sendBtn.disabled = false;
            }
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
